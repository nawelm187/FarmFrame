<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmFrame</title>
<style>
:root{--b0:#0B0D0F;--b1:#111416;--b2:#171A1D;--b3:#202428;--b4:#2A2F33;--t1:#E4E2DC;--t2:#C5C6C4;--t3:#8E9392;--acc:#5FA8A3;--gold:#B89A5B;--red:#C0524A;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--b0);color:var(--t1);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--b1);border-right:1px solid var(--b4);padding:14px 0}
.logo{padding:0 16px 14px;font-weight:600;letter-spacing:.04em}.logo span{color:var(--gold)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--t2);padding:8px 16px;font:inherit;cursor:pointer}
nav button:hover{background:var(--b2)}nav button[aria-current=page]{border-left-color:var(--acc);color:var(--t1);background:var(--b2)}
nav small{display:block;padding:12px 16px 4px;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
main{padding:18px 22px;min-width:0;max-width:1040px}
#sbtn{width:100%;text-align:left;background:var(--b2);border:1px solid var(--b4);color:var(--t3);padding:9px 12px;font:inherit;cursor:pointer;margin-bottom:18px}
kbd{border:1px solid var(--b4);padding:0 5px;font-size:11px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:12px;margin:22px 0 8px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}h3{font-size:14px;margin:0}
p.lead{color:var(--t2);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{background:var(--b2);border:1px solid var(--b3);padding:10px 12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:11px;padding:1px 6px;border:1px solid var(--b4);color:var(--t2);white-space:nowrap}
.FRESH{color:var(--acc);border-color:var(--acc)}.STALE,.EXPIRED{color:var(--gold);border-color:var(--gold)}.UNAVAILABLE,.LOADING{color:var(--t3)}.ERROR{color:var(--red);border-color:var(--red)}
.muted{color:var(--t3);font-size:12px}.big{font-size:18px;font-variant-numeric:tabular-nums}.gold{color:var(--gold)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--b3);font-size:13px;vertical-align:top}th{color:var(--t3);font-weight:500}
input,select,button.a{background:var(--b2);border:1px solid var(--b4);color:var(--t1);padding:7px 9px;font:inherit}button.a{cursor:pointer}button.a:hover{border-color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.wrap{overflow-x:auto}a{color:var(--acc)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:9}#ov.on{display:flex}
#pal{width:min(560px,94vw);background:var(--b1);border:1px solid var(--b4)}#q{width:100%;border:0;border-bottom:1px solid var(--b4);padding:12px;font-size:15px;background:var(--b1)}
#res{max-height:50vh;overflow:auto}#res div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}#res div[aria-selected=true]{background:var(--b3);box-shadow:inset 2px 0 var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--b4)}nav small,.logo{display:none}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav button[aria-current=page]{border-bottom-color:var(--acc)}main{padding:14px}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav><main><button id="sbtn">Search relics, items, pages… or ask "where do I farm X" <kbd>Ctrl K</kbd></button><div id="view"></div></main></div>
<div id="ov" role="dialog" aria-modal="true" aria-label="Search"><div id="pal"><input id="q" placeholder="Search or ask, e.g. where do I farm Plastids?" autocomplete="off"><div id="res" role="listbox"></div></div></div>
<script>
// ===== Data layer: every dataset carries provenance. Nothing is invented. =====
const API="https://api.warframestat.us/pc/",DROPS="https://drops.warframestat.us/data/";
const WS=["fissures","sortie","archonHunt","nightwave","invasions","voidTrader","cetusCycle","vallisCycle","cambionCycle","zarimanCycle","earthCycle","steelPath","arbitration"];
const WIN={ws:150e3,cat:864e5};
const SRC={warframestat:"WarframeStat API (community, unofficial)",drops:"Digital Extremes drop tables via WFCD/warframe-drop-data"};
const D={};let loading={};
async function load(id,url,kind,src){
  loading[id]=1;
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);const r=await fetch(url,{signal:c.signal});clearTimeout(t);
    if(!r.ok)throw new Error("HTTP "+r.status);D[id]={data:await r.json(),at:Date.now(),url,kind,src,err:null}}
  catch(e){D[id]={...(D[id]||{data:null,at:null}),url,kind,src,err:(e.name=="AbortError"?"timeout":String(e.message||e))+" (network, CORS or service down)"}}
  delete loading[id];
}
function fresh(id,now=Date.now()){const r=D[id];if(!r)return loading[id]?"LOADING":"UNAVAILABLE";
  if(r.data==null)return r.err?"ERROR":"UNAVAILABLE";if(r.err)return "STALE";
  return now-r.at>WIN[r.kind]?"STALE":"FRESH"}
const refreshWS=()=>Promise.all(WS.map(k=>load(k,API+k,"ws","warframestat"))).then(()=>{if(["home","world","fissures"].includes(cur))render()});
const ensure=(id,file)=>{if((D[id]&&(D[id].data||D[id].err))||loading[id])return;load(id,DROPS+file,"cat","drops").then(render)};
// ===== Helpers =====
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);const ts=v=>Date.parse(v);
const badge=s=>`<span class="tag ${s}">${s}</span>`;
function fmt(ms){if(ms<=0)return "0s";const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+"d ":"")+(h?h+"h ":"")+(d?"":m+"m ")+(d||h?"":s%60+"s")}
const cd=(exp,pre="")=>`<span class="big" data-exp="${exp}" data-pre="${esc(pre)}"></span>`;
const prov=id=>{const r=D[id];return `<div class="muted">${r&&r.at?"Retrieved "+new Date(r.at).toLocaleTimeString():"Not retrieved"}${r&&r.err?" · "+esc(r.err):""}</div>`};
const list=(id,f)=>{const d=D[id]&&D[id].data;return Array.isArray(d)?d:null};
const obj=id=>{const d=D[id]&&D[id].data;return d&&typeof d=="object"&&!Array.isArray(d)?d:null};
function unav(t,id,why){return `<div class="card"><div class="row"><h3>${t}</h3>${badge(id?fresh(id):"UNAVAILABLE")}</div><p class="muted" style="margin:6px 0 0">${why||"No verified data."}</p>${id?prov(id):""}</div>`}
function card(t,id,body){return `<div class="card"><div class="row"><h3>${t}</h3>${badge(fresh(id))}</div><div style="margin-top:6px">${body}</div>${prov(id)}</div>`}
// ===== World State cards (each parser validates shape; else shows UNAVAILABLE) =====
const now=()=>Date.now();
function cycle(t,id,key,labels){const o=obj(id);if(!o||!o.expiry||!o.state)return unav(t,id,D[id]?.err?"Request failed.":"Waiting for data.");
  if(ts(o.expiry)<now())return unav(t,id,"Cycle data expired; refreshing.");
  return card(t,id,`<div><b>${esc(labels?.[o.state]||o.state)}</b></div>${cd(o.expiry,"ends in ")}`)}
function worldCards(){const c=[];
  c.push(cycle("Cetus (Plains)","cetusCycle"));c.push(cycle("Orb Vallis","vallisCycle"));c.push(cycle("Cambion Drift","cambionCycle"));c.push(cycle("Zariman","zarimanCycle"));c.push(cycle("Earth","earthCycle"));
  const so=obj("sortie");c.push(so&&so.variants&&ts(so.expiry)>now()?card("Sortie","sortie",`<div class="muted">${esc(so.boss)} · ${esc(so.faction)}</div>${so.variants.map(v=>`<div>${esc(v.missionType)} — ${esc(v.node)}<div class="muted">${esc(v.modifier)}</div></div>`).join("")}${cd(so.expiry,"ends in ")}`):unav("Sortie","sortie","No active sortie in the feed."));
  const ah=obj("archonHunt");c.push(ah&&ah.expiry&&Array.isArray(ah.missions)&&ts(ah.expiry)>now()?card("Archon Hunt","archonHunt",`<div class="muted">${esc(ah.boss||"")}</div>${ah.missions.map(m=>`<div>${esc(m.type||m.missionType||"")} — ${esc(m.node||"")}</div>`).join("")}${cd(ah.expiry,"ends in ")}`):unav("Archon Hunt","archonHunt","No verified active hunt."));
  const ar=obj("arbitration");c.push(ar&&ar.expired===false&&ar.expiry&&ts(ar.expiry)>now()?card("Arbitration","arbitration",`<div>${esc(ar.type)} — ${esc(ar.node)}</div><div class="muted">${esc(ar.enemy)}</div>${cd(ar.expiry,"ends in ")}`):unav("Arbitration","arbitration","The source reports no current arbitration (its feed is marked unstable)."));
  const nw=obj("nightwave");c.push(nw&&Array.isArray(nw.activeChallenges)?card("Nightwave","nightwave",`<div class="muted">Season ${esc(nw.season)}</div>${nw.activeChallenges.filter(x=>ts(x.expiry)>now()).slice(0,5).map(x=>`<div>${x.isElite?'<span class="gold">Elite</span> ':""}${esc(x.title)} <span class="muted">${esc(x.reputation)} standing</span></div>`).join("")}`):unav("Nightwave","nightwave"));
  const bt=obj("voidTrader");c.push(bt&&bt.activation?(ts(bt.activation)>now()?card("Void Trader","voidTrader",`<div>${esc(bt.character)} arrives at ${esc(bt.location)}</div>${cd(bt.activation,"arrives in ")}`):ts(bt.expiry)>now()?card("Void Trader","voidTrader",`<div>${esc(bt.character)} at ${esc(bt.location)}</div>${cd(bt.expiry,"leaves in ")}`):unav("Void Trader","voidTrader","Trader data is outdated.")):unav("Void Trader","voidTrader"));
  const sp=obj("steelPath");c.push(sp&&sp.currentReward&&ts(sp.expiry)>now()?card("Steel Path Honors","steelPath",`<div>${esc(sp.currentReward.name)} <span class="muted">${esc(sp.currentReward.cost)} Steel Essence</span></div>${cd(sp.expiry,"rotates in ")}`):unav("Steel Path Honors","steelPath"));
  const iv=list("invasions");c.push(iv?card("Invasions","invasions",`<div class="big">${iv.filter(i=>!i.completed).length} active</div><div class="muted"><a href="#" data-go="invasions">View details</a></div>`):unav("Invasions","invasions"));
  const fs=list("fissures");c.push(fs?card("Void Fissures","fissures",`<div class="big">${fs.filter(f=>ts(f.expiry)>now()).length} active</div><div class="muted"><a href="#" data-go="fissures">Open fissure list</a></div>`):unav("Void Fissures","fissures"));
  return c.join("")}
// ===== Pages =====
let cur="home",pend="",FT="",FS=false,FK="all";
const NAV=[["home","Home"],["S","World State"],["world","Overview"],["fissures","Fissures"],["invasions","Invasions"],["S","Farming"],["relics","Relics"],["finder","Resource Finder"],["S","Progress"],["tracking","Tracking"],["sources","Data Sources"]];
const mem=(()=>{try{return JSON.parse(localStorage.getItem("ff.track")||"[]")}catch(e){return []}})();
const save=()=>{try{localStorage.setItem("ff.track",JSON.stringify(mem))}catch(e){}};
const V={
home(){return `<h1>FarmFrame</h1><p class="lead">Live Warframe data with visible provenance and freshness. Timers count down to the exact expiry supplied by the source.</p><div class="grid">${worldCards()}</div>`},
world(){return `<h1>World State</h1><p class="lead">Refreshes automatically every 60 seconds. An activity without verifiable data shows UNAVAILABLE instead of an estimate.</p><div class="grid">${worldCards()}</div>`},
fissures(){const fs=list("fissures");if(!fs)return `<h1>Void Fissures</h1>${unav("Void Fissures","fissures")}`;
  const T=["Lith","Meso","Neo","Axi","Requiem","Omnia"];let a=fs.filter(f=>ts(f.expiry)>now());
  if(FT)a=a.filter(f=>f.tier==FT);if(FS)a=a.filter(f=>f.isHard);if(FK=="void")a=a.filter(f=>!f.isStorm);if(FK=="storm")a=a.filter(f=>f.isStorm);
  a.sort((x,y)=>x.tierNum-y.tierNum||ts(x.expiry)-ts(y.expiry));
  return `<h1>Void Fissures</h1><div class="bar"><select id="ft" aria-label="Tier"><option value="">All tiers</option>${T.map(t=>`<option ${t==FT?"selected":""}>${t}</option>`).join("")}</select><select id="fk" aria-label="Kind"><option value="all">Star Chart and Railjack</option><option value="void" ${FK=="void"?"selected":""}>Star Chart only</option><option value="storm" ${FK=="storm"?"selected":""}>Void Storms (Railjack)</option></select><label class="muted"><input type="checkbox" id="fsp" ${FS?"checked":""}> Steel Path only</label> ${badge(fresh("fissures"))}</div>
  <div class="wrap"><table><tr><th>Tier</th><th>Mission</th><th>Node</th><th>Enemy</th><th>Path</th><th>Time left</th></tr>${a.map(f=>`<tr><td>${esc(f.tier)}</td><td>${esc(f.missionType)}</td><td>${esc(f.node)}</td><td>${esc(f.enemy)}</td><td>${f.isHard?'<span class="gold">Steel Path</span>':"Normal"}${f.isStorm?" · Storm":""}</td><td>${cd(f.expiry)}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">No fissures match.</td></tr>`}</table></div>${prov("fissures")}`},
invasions(){const iv=list("invasions");if(!iv)return `<h1>Invasions</h1>${unav("Invasions","invasions")}`;
  const rw=s=>s&&s.reward&&s.reward.countedItems?s.reward.countedItems.map(i=>`${i.count}x ${esc(i.type)}`).join(", ")+((s.reward.items||[]).length?", "+s.reward.items.map(esc).join(", "):""):"None";
  const a=iv.filter(i=>!i.completed);return `<h1>Invasions</h1><p class="lead">${badge(fresh("invasions"))}</p><div class="wrap"><table><tr><th>Node</th><th>Type</th><th>Attacker reward</th><th>Defender reward</th><th>Progress</th></tr>${a.map(i=>`<tr><td>${esc(i.node)}</td><td>${esc(i.desc)}</td><td>${esc(i.attacker?.faction)}: ${rw(i.attacker)}</td><td>${esc(i.defender?.faction)}: ${rw(i.defender)}</td><td>${Math.max(0,Math.min(100,+i.completion||0)).toFixed(0)}%</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No active invasions.</td></tr>`}</table></div>${prov("invasions")}`},
relics(){ensure("relics","relics.json");const rs=relicList();
  if(!rs)return `<h1>Relics</h1><p class="lead">Drop chances from the official drop tables.</p>${D.relics?.err||fresh("relics")=="LOADING"?unav("Relic data","relics",D.relics?.err?"Failed to load.":"Loading relic tables…"):unav("Relic data","relics")}`;
  return `<h1>Relics</h1><p class="lead">Search by relic (e.g. "Lith A1") or by reward item. Chances by refinement come straight from the drop tables. Vault status is not part of this dataset, so it is not shown.</p><div class="bar"><input id="rq" placeholder="Relic or item name" value="${esc(pend)}" style="min-width:260px"></div><div id="rout">${relicOut(pend)}</div>${prov("relics")}`},
finder(){ensure("relics","relics.json");FIND.forEach(f=>ensure(f.id,f.file));
  return `<h1>Resource Finder</h1><p class="lead">Where an item drops, from the official drop tables: missions, enemies, mods, bounties, sorties, objectives and syndicates. Items that only come from other systems (vendors, crafting, trading) are not covered.</p><div class="bar"><input id="fq" placeholder="Item or resource name, e.g. Plastids" value="${esc(pend)}" style="min-width:260px"></div><div id="fout">${findOut(pend)}</div>`},
tracking(){return `<h1>Tracking</h1><p class="lead">Manual progress. Stored only in this browser.</p><div class="bar"><input id="tn" placeholder="Item or resource name" aria-label="Name"><input id="tq" type="number" min="0" placeholder="Owned" style="width:90px" aria-label="Owned"><input id="tt" type="number" min="1" placeholder="Needed" style="width:90px" aria-label="Needed"><button class="a" id="tadd">Add</button></div><div class="wrap"><table><tr><th>Name</th><th>Owned</th><th>Needed</th><th>Missing</th><th></th></tr>${mem.map((m,i)=>`<tr><td>${esc(m.n)}</td><td>${m.o}</td><td>${m.t}</td><td>${Math.max(0,m.t-m.o)}</td><td><button class="a" data-find="${esc(m.n)}">Where to farm</button> <button class="a" data-del="${i}">Remove</button></td></tr>`).join("")||`<tr><td colspan="5" class="muted">No tracked items.</td></tr>`}</table></div>`},
sources(){const ids=[...WS,"relics",...FIND.map(f=>f.id)];return `<h1>Data Sources</h1><p class="lead">Status is computed from the last successful retrieval (${WIN.ws/1000}s window for live data, 24h for tables).</p><div class="bar"><button class="a" id="rf">Refresh all now</button></div><div class="wrap"><table><tr><th>Dataset</th><th>Status</th><th>Source</th><th>Last retrieved</th><th>Detail</th></tr>${ids.map(i=>{const r=D[i];return `<tr><td>${i}</td><td>${badge(fresh(i))}</td><td>${r?esc(SRC[r.src]):"—"}</td><td>${r&&r.at?new Date(r.at).toLocaleString():"Never"}</td><td class="muted">${r&&r.err?esc(r.err):r?esc(r.url):"Not requested yet"}</td></tr>`}).join("")}</table></div><h2>Notes</h2><p class="muted">World state comes from a community API, not directly from Digital Extremes. Drop tables are the official published tables in a parsed format. Where sources disagree or a feed is flagged unstable, the app shows the gap instead of guessing.</p>`}
};
// ===== Relics / finder logic =====
let RC=null,RCsrc=null;
function relicList(){const d=D.relics&&D.relics.data;if(!d)return null;if(RCsrc===d)return RC;const arr=Array.isArray(d)?d:d.relics;if(!Array.isArray(arr))return null;
  const m=new Map();for(const r of arr){if(!r||!r.tier||!r.relicName||!Array.isArray(r.rewards))continue;const k=r.tier+" "+r.relicName;if(!m.has(k))m.set(k,{name:k,tier:r.tier,st:{}});m.get(k).st[r.state]=r.rewards}
  RC=[...m.values()];RCsrc=d;return RC.length?RC:null}
const STATES=["Intact","Exceptional","Flawless","Radiant"];
function relicOut(q){const rs=relicList();q=q.trim().toLowerCase();if(!rs)return "";if(!q)return `<p class="muted">Type a relic or item name.</p>`;
  const hit=rs.filter(r=>r.name.toLowerCase().includes(q)||(r.st.Intact||[]).some(x=>x.itemName.toLowerCase().includes(q))).slice(0,25);
  const act=t=>{const f=list("fissures");return f?f.filter(x=>x.tier==t&&ts(x.expiry)>now()).length:null};
  return hit.map(r=>{const base=r.st.Intact||Object.values(r.st)[0];const a=act(r.tier);return `<div class="card" style="margin-bottom:8px"><div class="row"><h3>${esc(r.name)}</h3><span class="muted">${a==null?"Fissure data unavailable":a+" active "+esc(r.tier)+" fissures"}</span></div><div class="wrap"><table><tr><th>Reward</th><th>Rarity</th>${STATES.map(s=>`<th>${s}</th>`).join("")}</tr>${base.map(x=>`<tr><td>${esc(x.itemName)}</td><td>${esc(x.rarity)}</td>${STATES.map(s=>{const y=(r.st[s]||[]).find(z=>z.itemName==x.itemName&&z.rarity==x.rarity);return `<td>${y?esc(y.chance)+"%":"—"}</td>`}).join("")}</tr>`).join("")}</table></div></div>`}).join("")||`<p class="muted">No relic matches "${esc(q)}".</p>`}
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const eff=(a,b)=>a!=null&&b!=null?Math.round(a*b)/100:b;
const rot=(o,f)=>{const r=[];if(o&&typeof o=="object")for(const [k,v] of Object.entries(o))if(Array.isArray(v))v.forEach(x=>x&&r.push(f(k,x)));return r};
const nm=x=>x.itemName||x.item;
// Each extractor validates its own shape and returns rows {item,where,mode,rot,ch,rar,note}; anything unrecognised yields null (shown as a gap).
const FIND=[
 {id:"missions",file:"missionRewards.json",label:"Mission rewards",ex(d){const mr=d.missionRewards||d;if(!mr||typeof mr!="object")return null;const r=[];
  for(const [pl,nodes] of Object.entries(mr)){if(!nodes||typeof nodes!="object")continue;for(const [nd,i] of Object.entries(nodes)){if(!i||!i.rewards)continue;
   const add=(k,x)=>({item:x.itemName,where:`${nd} (${pl})`+(i.isEvent?" (event)":""),mode:i.gameMode||"",rot:k,ch:num(x.chance),rar:x.rarity,note:""});
   if(Array.isArray(i.rewards))i.rewards.forEach(x=>x&&x.itemName&&r.push(add("",x)));else r.push(...rot(i.rewards,add).filter(x=>x.item))}}return r.length?r:null}},
 ...[["enemyBlueprintTables","Enemy blueprint drops"],["miscItems","Enemy item drops"]].map(([id,label])=>({id,file:id+".json",label,ex(d){const a=d[id]||d;if(!Array.isArray(a))return null;const r=[];
  for(const e of a){if(!e||!e.enemyName||!Array.isArray(e.items))continue;const dc=num(e.enemyItemDropChance);for(const x of e.items)if(x&&x.itemName)r.push({item:x.itemName,where:e.enemyName,mode:"Enemy drop",rot:"",ch:eff(dc,num(x.chance)),rar:x.rarity,note:`${dc??"?"}% chance the enemy drops loot × ${num(x.chance)}% within its table`})}return r.length?r:null}})),
 {id:"modLocations",file:"modLocations.json",label:"Mod drops",ex(d){const a=d.modLocations||d;if(!Array.isArray(a))return null;const r=[];
  for(const m of a){if(!m||!m.modName||!Array.isArray(m.enemies))continue;for(const e of m.enemies)if(e&&e.enemyName){const dc=num(e.enemyModDropChance);r.push({item:m.modName,where:e.enemyName,mode:"Enemy drop",rot:"",ch:eff(dc,num(e.chance)),rar:e.rarity,note:`${dc??"?"}% mod drop × ${num(e.chance)}% within its table`})}}return r.length?r:null}},
 ...[["cetusBountyRewards","Cetus bounties"],["solarisBountyRewards","Fortuna bounties"],["zarimanRewards","Zariman bounties"]].map(([id,label])=>({id,file:id+".json",label,ex(d){const a=d[id]||d;if(!Array.isArray(a))return null;const r=[];
  for(const b of a){if(!b||!b.rewards)continue;r.push(...rot(b.rewards,(k,x)=>({item:nm(x),where:`${label}: ${b.bountyLevel||""}`,mode:"Bounty",rot:k,ch:num(x.chance),rar:x.rarity,note:x.stage||""})).filter(x=>x.item))}return r.length?r:null}})),
 {id:"sortieRewards",file:"sortieRewards.json",label:"Sortie rewards",ex(d){const a=d.sortieRewards||d;if(!Array.isArray(a))return null;const r=a.filter(x=>x&&x.itemName).map(x=>({item:x.itemName,where:"Sortie",mode:"Sortie",rot:"",ch:num(x.chance),rar:x.rarity,note:""}));return r.length?r:null}},
 {id:"transientRewards",file:"transientRewards.json",label:"Objective rewards",ex(d){const a=d.transientRewards||d;if(!Array.isArray(a))return null;const r=[];for(const o of a)if(o&&o.objectiveName&&Array.isArray(o.rewards))for(const x of o.rewards)if(x&&x.itemName)r.push({item:x.itemName,where:o.objectiveName,mode:"Objective",rot:"",ch:num(x.chance),rar:x.rarity,note:""});return r.length?r:null}},
 {id:"syndicates",file:"syndicates.json",label:"Syndicate offerings",ex(d){const o=d.syndicates||d;if(!o||typeof o!="object"||Array.isArray(o))return null;const r=[];for(const [n,a] of Object.entries(o))if(Array.isArray(a))for(const x of a)if(x&&x.item)r.push({item:x.item,where:`${n}: ${x.place||""}`,mode:"Syndicate",rot:"",ch:num(x.chance),rar:x.rarity,note:x.standing!=null?x.standing+" standing":""});return r.length?r:null}},
 {id:"resourceByAvatar",file:"resourceByAvatar.json",label:"Resource drops (enemies)",ex(d){const a=d.resourceByAvatar||d;if(!Array.isArray(a))return null;const r=[];
  for(const e of a){const w=e&&(e.enemyName||e.source||e.avatar),l=e&&(e.items||e.resources||e.drops);if(!w||!Array.isArray(l))continue;const dc=num(e.enemyItemDropChance??e.chance);for(const x of l){const n=x&&(x.itemName||x.item||x.resource),c=x&&num(x.chance);if(n&&c!=null)r.push({item:n,where:String(w),mode:"Enemy drop",rot:"",ch:eff(dc,c),rar:x.rarity||"",note:""})}}return r.length?r:null}}];
const FC={};
function findRows(){const all=[],st=[];for(const f of FIND){const rec=D[f.id];
  if(!rec||!rec.data){st.push({f,s:rec&&rec.err?"ERROR":loading[f.id]?"LOADING":"UNAVAILABLE"});continue}
  if(FC[f.id]?.src!==rec.data)FC[f.id]={src:rec.data,rows:f.ex(rec.data)};
  const rows=FC[f.id].rows;if(!rows){st.push({f,s:"UNAVAILABLE",bad:1});continue}
  st.push({f,s:fresh(f.id),n:rows.length});rows.forEach(x=>{x.src=f.label;all.push(x)})}
  return {all,st}}
function findOut(q){q=q.trim().toLowerCase();if(!q)return `<p class="muted">Search for a resource, mod, part or item.</p>`;
  const {all,st}=findRows();const ok=st.filter(x=>x.n).length;
  const gaps=st.filter(x=>!x.n).map(x=>`${esc(x.f.label)}: ${x.bad?"unrecognised data shape, ignored":x.s.toLowerCase()}`);
  let h=`<p class="muted">${ok}/${st.length} drop datasets loaded${gaps.length?" · not shown: "+gaps.join("; "):""}</p>`;
  if(!ok)return h+unav("Drop tables",null,"Nothing loaded yet or all requests failed. See Data Sources.");
  const m=all.filter(r=>r.item.toLowerCase().includes(q)).sort((a,b)=>(b.item.toLowerCase()==q)-(a.item.toLowerCase()==q)||(b.ch??-1)-(a.ch??-1)).slice(0,40);
  const rl=(relicList()||[]).filter(r=>(r.st.Intact||[]).some(x=>x.itemName.toLowerCase().includes(q))).slice(0,10);
  h+=m.length?`<h2>Where it drops (highest chance first)</h2><div class="wrap"><table><tr><th>Item</th><th>Source</th><th>Location</th><th>Rot.</th><th>Chance</th><th>Rarity</th><th>Detail</th></tr>${m.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.src)}</td><td>${esc(r.where)}${r.mode&&r.mode!=r.src?` <span class="muted">${esc(r.mode)}</span>`:""}</td><td>${esc(r.rot||"—")}</td><td>${r.ch==null?"—":r.ch+"%"}</td><td>${esc(r.rar)}</td><td class="muted">${esc(r.note)}</td></tr>`).join("")}</table></div><p class="muted">Mission chances are per reward roll in that rotation, not per run. Enemy chances combine the enemy's drop chance with the table chance.</p>`:`<p class="muted">No drop for "${esc(q)}" in the loaded tables.</p>`;
  if(rl.length)h+=`<h2>Relics containing it</h2><p>${rl.map(r=>`<a href="#" data-relic="${esc(r.name)}">${esc(r.name)}</a>`).join(" · ")}</p>`;return h}
// ===== Shell =====
function render(){$("nav").innerHTML=`<div class="logo">FARM<span>FRAME</span></div>`+NAV.map(([id,l])=>id=="S"?`<small>${l}</small>`:`<button data-go="${id}" ${id==cur?'aria-current="page"':""}>${l}</button>`).join("");
  const y=scrollY;$("view").innerHTML=(V[cur]||V.home)();wire();tick();scrollTo(0,y)}
function wire(){const g=id=>$(id);
  if(g("ft"))g("ft").onchange=e=>{FT=e.target.value;render()};if(g("fk"))g("fk").onchange=e=>{FK=e.target.value;render()};if(g("fsp"))g("fsp").onchange=e=>{FS=e.target.checked;render()};
  if(g("rq"))g("rq").oninput=e=>{pend=e.target.value;g("rout").innerHTML=relicOut(pend)};
  if(g("fq"))g("fq").oninput=e=>{pend=e.target.value;g("fout").innerHTML=findOut(pend)};
  if(g("rf"))g("rf").onclick=()=>{refreshWS();load("relics",DROPS+"relics.json","cat","drops").then(render);FIND.forEach(f=>load(f.id,DROPS+f.file,"cat","drops").then(render))};
  if(g("tadd"))g("tadd").onclick=()=>{const n=g("tn").value.trim(),o=+g("tq").value||0,t=+g("tt").value;if(!n||!(t>0))return;mem.push({n,o,t});save();render()}}
function tick(){const n=now();document.querySelectorAll("[data-exp]").forEach(e=>{const l=ts(e.dataset.exp)-n;e.textContent=l>0?e.dataset.pre+fmt(l):"expired, refreshing"})}
function go(id,q){cur=id;if(q!=null)pend=q;else if(!["relics","finder"].includes(id))pend="";if(!NAV.some(x=>x[0]==cur))cur="home";closeP();render()}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}
  const d=e.target.closest("[data-del]");if(d){mem.splice(+d.dataset.del,1);save();render()}
  const f=e.target.closest("[data-find]");if(f)go("finder",f.dataset.find);
  const r=e.target.closest("[data-relic]");if(r){e.preventDefault();go("relics",r.dataset.relic)}});
// ===== Search palette =====
let sel=0,items=[];const PAGES=NAV.filter(x=>x[0]!="S"&&x[0]!="home").map(x=>[x[0],x[1]]);
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function search(q){q=q.trim();const l=q.toLowerCase();if(!l)return [];const o=[];
  const m=l.match(/^(?:where(?: do i| can i)? (?:farm|get|find)|how(?: do i)? (?:farm|get)|farm)\s+(.+?)\??$/);
  if(m)o.push({label:`Where to farm "${m[1]}"`,cat:"Intent",go:"finder",q:m[1]});
  PAGES.forEach(([id,n])=>{const x=n.toLowerCase();const s=x.startsWith(l)?0:x.includes(l)?1:(l.length>3&&lev(l,x)<=2?2:9);if(s<9)o.push({label:n,cat:"Page",go:id,s})});
  const rs=relicList();if(rs){rs.filter(r=>r.name.toLowerCase().includes(l)).slice(0,4).forEach(r=>o.push({label:r.name,cat:"Relic",go:"relics",q:r.name,s:1}));
    const seen=new Set();for(const r of rs){for(const x of r.st.Intact||[]){const n=x.itemName;if(!seen.has(n)&&n.toLowerCase().includes(l)){seen.add(n);o.push({label:n,cat:"Item",go:"finder",q:n,s:1})}}if(seen.size>=5)break}}
  return o.sort((a,b)=>(a.s??-1)-(b.s??-1)).slice(0,9)}
function openP(){$("ov").classList.add("on");$("q").value="";draw();$("q").focus();if(!D.relics)load("relics",DROPS+"relics.json","cat","drops")}
function closeP(){$("ov").classList.remove("on")}
function draw(){items=search($("q").value);sel=0;$("res").innerHTML=items.map((r,i)=>`<div role="option" data-i="${i}" aria-selected="${i==sel}"><span>${esc(r.label)}</span><span class="tag">${r.cat}</span></div>`).join("")||`<div class="muted">${$("q").value?"No results":"Type to search"}</div>`}
$("q").addEventListener("input",draw);$("sbtn").onclick=openP;
$("res").addEventListener("click",e=>{const r=e.target.closest("[data-i]");if(r){const i=items[+r.dataset.i];go(i.go,i.q)}});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();openP()}
  if(!$("ov").classList.contains("on"))return;if(e.key=="Escape")closeP();
  if(e.key=="ArrowDown"||e.key=="ArrowUp"){e.preventDefault();sel=(sel+(e.key=="ArrowDown"?1:-1)+items.length)%Math.max(items.length,1);[...$("res").children].forEach((c,i)=>c.setAttribute("aria-selected",i==sel))}
  if(e.key=="Enter"&&items[sel])go(items[sel].go,items[sel].q)});
$("ov").addEventListener("click",e=>{if(e.target.id=="ov")closeP()});
// ===== Boot =====
render();refreshWS();setInterval(refreshWS,60000);setInterval(tick,1000);
</script></body></html>
